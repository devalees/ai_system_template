{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block object-tools %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="{% url 'admin:core_settings_hub' %}" 
       style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff !important; padding: 9px 18px; border-radius: 6px; font-weight: 700; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 5px rgba(2,132,199,0.3);">
      <span style="font-size: 15px;">⚙️</span> {% trans "Open Visual Settings Hub" %}
    </a>
    <span style="color: var(--body-quiet-color, #64748b); font-size: 12px;">
      {% trans "Manage platform defaults, AI providers, and system parameters on a unified visual dashboard." %}
    </span>
  </div>
  <div>
    {{ block.super }}
  </div>
</div>
{% endblock %}
