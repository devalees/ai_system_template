services:
  db:
    image: postgres:16-alpine
    container_name: django-template-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_system_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_system_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  redis:
    image: redis:7-alpine
    container_name: django-template-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-template-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - ../agent_service/profiles:/app/agent_profiles:rw
      - ../agent_service/data/profiles:/app/hermes_runtime_profiles:rw
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_admin &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - backend_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-template-celery-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - ../agent_service/profiles:/app/agent_profiles:rw
      - ../agent_service/data/profiles:/app/hermes_runtime_profiles:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A core worker -l info
    networks:
      - backend_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-template-celery-beat
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend_network

volumes:
  postgres_data:
  redis_data:

networks:
  backend_network:
    driver: bridge
