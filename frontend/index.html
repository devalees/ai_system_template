<!DOCTYPE html>
<html lang="en" data-theme="sovereign-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2358a6ff'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sovereign Platform | Enterprise OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Zero-FCP Splash Loader */
      #splash-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090d13;
        color: #e6edf3;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        z-index: 99999;
        transition: opacity 0.3s ease;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #58a6ff;
        animation: spin 0.8s ease-in-out infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash-loader">
      <div class="spinner"></div>
      <div style="font-size: 14px; font-weight: 500; letter-spacing: 0.5px; opacity: 0.8;">
        Sovereign Platform
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
